<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ប៉ាវ សុី ស៊ុង</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="container">
      <h1 class="game-title">ប៉ាវ សុី ស៊ុង</h1>
      
      <div class="result_field">
        <div class="result_images">
          <div class="user_result">
            <img src="images/rock.png" alt="ជម្រើសរបស់អ្នក" />
          </div>
          <div class="vs-text">ប្រកួត</div>
          <div class="bot_result">
            <img src="images/rock.png" alt="ជម្រើសរបស់កុំព្យូទ័រ" />
          </div>
        </div>
        <div class="result">តោះលេង!</div>
      </div>

      <!-- ជម្រើសសម្រាប់អ្នកលេង / Options for user to choose from -->
      <div class="option_images">
        <div class="option_image">
          <img src="images/rock.png" alt="រូបថ្ម" />
          <p>ថ្ម</p>
        </div>
        <div class="option_image">
          <img src="images/paper.png" alt="រូបក្រដាស" />
          <p>ក្រដាស</p>
        </div>
        <div class="option_image">
          <img src="images/scissors.png" alt="រូបកន្ត្រៃ" />
          <p>កន្ត្រៃ</p>
        </div>
      </div>
    </section>

    <script src="script.js" defer></script>
  </body>
</html>
